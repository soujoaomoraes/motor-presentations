<!-- ═══════════════════ MOTOR v3 · NÃO EDITAR DAQUI PARA BAIXO ═══════════════════ -->
<style id="motor-css">
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);font-family:var(--fonte);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
#palco{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--fundo);transition:transform .3s ease}

/* ── slides ── */
.slide{position:absolute;inset:0;padding:110px 140px;display:flex;flex-direction:column;justify-content:center;gap:30px;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s}
.slide.ativo{opacity:1;visibility:visible;transition:opacity .3s ease}
:where([data-passo]:not(.visto)){visibility:hidden}
.slide h1{font-size:160px;line-height:.95;letter-spacing:-.04em;font-weight:700;margin:0}
.slide h2{font-size:80px;line-height:1.04;letter-spacing:-.028em;font-weight:650;margin:0;max-width:1520px}
.slide h3{font-size:42px;line-height:1.2;font-weight:600;margin:0}
.slide p{font-size:32px;line-height:1.45;margin:0;color:var(--texto-2);max-width:1400px}
.slide .sub{font-size:40px;line-height:1.35;color:var(--texto-2)}
.slide .fonte{font-size:22px;color:var(--texto-3)}
.selo{display:inline-flex;align-self:flex-start;align-items:center;gap:14px;font-size:22px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--destaque)}
.selo::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.capa{justify-content:flex-end;padding-bottom:150px}
.capa::after{content:"";position:absolute;right:-260px;top:-260px;width:900px;height:900px;border-radius:50%;border:1px solid var(--borda);pointer-events:none}
.capa::before{content:"";position:absolute;right:-60px;top:-60px;width:500px;height:500px;border-radius:50%;border:1px solid var(--borda);pointer-events:none}
.centro{align-items:center;text-align:center}
.centro .selo{align-self:center}
.centro.capa{justify-content:center;padding-bottom:110px}
kbd{font-family:inherit;font-size:.78em;border:1px solid var(--borda);border-bottom-width:3px;border-radius:8px;padding:.04em .42em;color:var(--texto);background:var(--superficie)}
.grade{display:grid;grid-template-columns:repeat(var(--colunas,2),minmax(0,1fr));gap:32px;margin-top:16px;align-items:start}
.cartao{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);padding:44px 48px;display:flex;flex-direction:column;gap:16px}
.cartao.destaque{border-color:var(--destaque)}
.cartao p{color:var(--texto)}
.numero b{font-size:112px;line-height:1;font-weight:700;letter-spacing:-.035em;color:var(--texto)}
.numero span{font-size:28px;color:var(--texto-2)}
.numero.destaque b{color:var(--destaque)}
.rotulo{font-size:20px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--texto-3)}
.lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:28px}
.lista li{font-size:36px;line-height:1.35;color:var(--texto);padding-left:50px;position:relative}
.lista li::before{content:"";position:absolute;left:0;top:.68em;width:24px;height:2px;background:var(--destaque)}
.passo{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.passo .bloco{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);padding:38px 44px;display:flex;flex-direction:column;gap:14px}
.passo .bloco p{color:var(--texto)}
.aviso{align-self:stretch;border-left:4px solid var(--alerta);background:var(--superficie);padding:26px 36px;border-radius:0 var(--raio) var(--raio) 0;font-size:30px;line-height:1.4;color:var(--texto);max-width:1640px}
.aviso.ok{border-left-color:var(--ok)}
.centro .aviso{align-self:center;text-align:left}
.caminhos{display:grid;grid-template-columns:repeat(var(--colunas,2),minmax(0,1fr));gap:24px;margin-top:8px;align-self:stretch}
.centro .caminhos{align-self:center;min-width:620px}
.caminho{position:relative;display:flex;flex-direction:column;gap:6px;padding:32px 90px 32px 40px;border-radius:var(--raio);border:1px solid var(--borda);background:var(--superficie-2);color:var(--texto);text-decoration:none;text-align:left;transition:border-color .2s,transform .2s}
.caminho::after{content:"→";position:absolute;right:38px;top:50%;transform:translateY(-50%);font-size:36px;color:var(--texto-3);transition:right .2s,color .2s}
.caminho strong{font-size:34px;font-weight:600}
.caminho small{font-size:24px;color:var(--texto-2)}
.caminho:hover{border-color:var(--destaque);transform:translateY(-3px)}
.caminho:hover::after{color:var(--destaque);right:30px}
.caminho.sim{box-shadow:inset 5px 0 0 var(--ok)}
.caminho.nao{box-shadow:inset 5px 0 0 var(--erro)}
.caminhos.pulsar{animation:pulsar .5s}
.chip-destino{position:absolute;top:-16px;right:16px;z-index:3;font-size:16px;font-weight:600;padding:5px 12px;border-radius:8px;background:var(--destaque);color:var(--sobre-destaque);cursor:pointer;user-select:none;opacity:0;transition:opacity .15s;font-family:var(--fonte)}
.caminho:hover .chip-destino{opacity:1}
.apresentando .chip-destino{display:none}
.etiqueta{font-size:22px;line-height:1.4;padding:14px 22px;border:1px dashed var(--destaque);border-radius:12px;color:var(--destaque);max-width:460px}
aside.notas{display:none}

@keyframes pulsar{0%,100%{transform:none}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@media (prefers-reduced-motion:reduce){#palco *,#palco .slide{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* texto editável direto */
html:not(.apresentando) #palco [contenteditable="true"]:not(.campo):not(.livre):hover{outline:1px dashed color-mix(in srgb,var(--destaque) 55%,transparent);outline-offset:6px;border-radius:4px}
#palco [contenteditable="true"]:not(.campo):not(.livre):focus{outline:2px solid var(--destaque);outline-offset:6px;border-radius:4px}
.campo{display:block;min-height:1.5em;font-size:26px;line-height:1.45;color:var(--texto);outline:none;border-radius:8px;cursor:text;white-space:pre-wrap;overflow-wrap:anywhere}
.campo.inline{display:inline-block;min-width:260px;font-size:inherit;line-height:inherit;color:var(--destaque);border-bottom:2px dashed var(--borda);border-radius:0}
.campo:empty::before{content:attr(data-dica);color:var(--texto-3);font-style:italic}
.campo:focus{box-shadow:0 0 0 2px var(--destaque);background:var(--fundo)}
.canvas{display:grid;grid-template-columns:repeat(var(--colunas,3),minmax(0,1fr));gap:22px;flex:1;min-height:0}
.canvas .caixa{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);padding:24px 28px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
.canvas .caixa.larga{grid-column:1/-1}
.canvas .caixa.alta{grid-row:span 2}
.canvas .caixa h3{font-size:26px;color:var(--texto)}
.canvas .caixa .campo{flex:1;font-size:22px}

/* ── objetos livres (slide ou quadro) ── */
.livre{position:absolute;margin:0;z-index:2;cursor:grab;user-select:none;-webkit-user-select:none;outline:none}
.livre[contenteditable="true"]{cursor:text;user-select:text;-webkit-user-select:text;box-shadow:0 0 0 2px var(--destaque)}
.livre.sel{box-shadow:0 0 0 2px var(--fundo),0 0 0 4px var(--destaque)}
.livre.arrastando{cursor:grabbing;opacity:.9;z-index:6}
.redim{position:absolute;right:-9px;bottom:-9px;width:16px;height:16px;border-radius:4px;background:var(--fundo);border:2px solid var(--destaque);cursor:nwse-resize;z-index:7}
.postit{width:280px;min-height:150px;padding:22px 24px;font-size:25px;line-height:1.35;color:#1d1c1a;background:var(--postit-1);border-radius:6px;box-shadow:0 12px 26px rgba(0,0,0,.25)}
.postit.sel{box-shadow:0 0 0 2px var(--fundo),0 0 0 4px var(--destaque),0 12px 26px rgba(0,0,0,.25)}
.texto{font-size:32px;line-height:1.35;color:var(--texto);padding:4px 6px;min-width:40px}
.carta{width:220px;min-height:120px;padding:20px 18px;border-radius:14px;background:var(--superficie-2);border:1px solid var(--borda);border-top:6px solid var(--postit-1);color:var(--texto);display:flex;flex-direction:column;gap:8px}
.carta b{font-size:23px;font-weight:650}
.carta small{font-size:18px;line-height:1.35;color:var(--texto-2)}
.forma{width:240px;height:140px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 20px;font-size:24px;line-height:1.3;color:var(--texto);border:2px solid var(--texto-2);border-radius:14px;background:transparent}
.forma[data-forma="elipse"]{border-radius:50%}
.forma[data-forma="losango"]{border:0;padding:14px 50px}
.fundo-forma{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;overflow:visible}
.fundo-forma polygon{fill:transparent;stroke:var(--texto-2);stroke-width:2;vector-effect:non-scaling-stroke}
.faixa{height:56px;min-width:120px;padding:0 26px;display:flex;align-items:center;font-size:22px;font-weight:600;color:#1d1c1a;background:var(--postit-1);border-radius:10px;white-space:nowrap;overflow:visible}
.faixa.lacuna{background:transparent;border:2px dashed var(--erro);color:var(--erro)}
.desenho svg{width:100%;height:100%;overflow:visible;display:block}
.desenho path{fill:none;stroke:var(--texto);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.imagem{width:600px}
.imagem img{display:block;width:100%;height:auto;border-radius:10px;pointer-events:none;-webkit-user-drag:none}
/* cores (1 a 4 vêm do tema) */
.postit[data-cor="2"],.faixa[data-cor="2"]{background:var(--postit-2)}.postit[data-cor="3"],.faixa[data-cor="3"]{background:var(--postit-3)}.postit[data-cor="4"],.faixa[data-cor="4"]{background:var(--postit-4)}
.carta[data-cor="2"]{border-top-color:var(--postit-2)}.carta[data-cor="3"]{border-top-color:var(--postit-3)}.carta[data-cor="4"]{border-top-color:var(--postit-4)}
.forma[data-cor]{color:#1d1c1a;border-color:transparent}
.forma[data-cor="1"]{background:var(--postit-1)}.forma[data-cor="2"]{background:var(--postit-2)}.forma[data-cor="3"]{background:var(--postit-3)}.forma[data-cor="4"]{background:var(--postit-4)}
.forma[data-forma="losango"][data-cor]{background:transparent}
.forma[data-forma="losango"][data-cor="1"] polygon{fill:var(--postit-1);stroke:none}.forma[data-forma="losango"][data-cor="2"] polygon{fill:var(--postit-2);stroke:none}
.forma[data-forma="losango"][data-cor="3"] polygon{fill:var(--postit-3);stroke:none}.forma[data-forma="losango"][data-cor="4"] polygon{fill:var(--postit-4);stroke:none}
.texto[data-cor="1"]{color:var(--destaque)}.texto[data-cor="2"]{color:var(--ok)}.texto[data-cor="3"]{color:var(--erro)}.texto[data-cor="4"]{color:var(--texto-2)}
.desenho[data-cor="1"] path{stroke:var(--destaque)}.desenho[data-cor="2"] path{stroke:var(--ok)}.desenho[data-cor="3"] path{stroke:var(--erro)}.desenho[data-cor="4"] path{stroke:var(--texto-3)}


.slide.topo{justify-content:flex-start}
.forma[data-forma="triangulo"]{border:0;padding:60px 40px 16px;align-items:flex-end}
.forma[data-forma="triangulo"][data-cor]{background:transparent}
.forma[data-forma="triangulo"][data-cor="1"] polygon{fill:var(--postit-1);stroke:none}.forma[data-forma="triangulo"][data-cor="2"] polygon{fill:var(--postit-2);stroke:none}
.forma[data-forma="triangulo"][data-cor="3"] polygon{fill:var(--postit-3);stroke:none}.forma[data-forma="triangulo"][data-cor="4"] polygon{fill:var(--postit-4);stroke:none}
.tabela{width:720px}
.tabela table{width:100%;border-collapse:separate;border-spacing:0;font-size:22px;color:var(--texto);background:var(--superficie);border:1px solid var(--borda);border-radius:12px;overflow:hidden}
.tabela th,.tabela td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--borda);border-right:1px solid var(--borda);min-width:60px;height:1.45em;vertical-align:top}
.tabela tr>:last-child{border-right:0}.tabela tr:last-child>*{border-bottom:0}
.tabela th{background:var(--superficie-2);font-weight:600;font-size:20px}
.tabela[contenteditable="true"] td:focus-within,.tabela[contenteditable="true"] th:focus-within{background:var(--fundo)}
.escala{width:760px;padding:22px 24px;background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);display:flex;flex-direction:column;gap:16px}
.escala-rot{font-size:26px;font-weight:600;color:var(--texto)}
.niveis{display:flex;gap:8px}
.nivel{flex:1;min-width:0;height:58px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--borda);background:var(--superficie-2);font-size:22px;font-weight:600;color:var(--texto-2);cursor:pointer;transition:background .15s,color .15s,transform .15s}
.nivel:hover{border-color:var(--destaque);color:var(--texto)}
.nivel.on{transform:translateY(-3px);color:#1d1c1a;border-color:transparent;background:var(--destaque)}
.escala[data-faixa="baixa"] .nivel.on{background:var(--erro)}.escala[data-faixa="media"] .nivel.on{background:var(--alerta)}.escala[data-faixa="alta"] .nivel.on{background:var(--ok)}
.linhas .traco.tracejado{stroke-dasharray:12 9}
.linhas .ext{fill:var(--fundo);stroke:var(--destaque);stroke-width:3;pointer-events:all;cursor:move}
.laco{position:absolute;z-index:9;border:1px solid var(--destaque);background:color-mix(in srgb,var(--destaque) 10%,transparent);pointer-events:none}
html[data-modo-ferr] #palco,html[data-modo-ferr] #palco *{cursor:crosshair!important}

.etapas{display:flex;gap:6px;align-items:stretch;padding:22px 24px 0}
.etapa{flex:1;position:relative;padding:22px 34px 22px 44px;background:var(--superficie-2);color:var(--texto);font-size:22px;font-weight:600;clip-path:polygon(0 0,calc(100% - 26px) 0,100% 50%,calc(100% - 26px) 100%,0 100%,26px 50%);border-top:4px solid var(--destaque)}
.etapa:first-child{clip-path:polygon(0 0,calc(100% - 26px) 0,100% 50%,calc(100% - 26px) 100%,0 100%);padding-left:28px}
.etapa.cliente{flex:none;width:120px;clip-path:none;border-radius:50%;aspect-ratio:1;display:grid;place-items:center;padding:0;font-size:16px;text-align:center;border:2px solid var(--borda);background:var(--fundo)}
.etapa .campo{font-size:22px}
.etapa.cliente .campo{font-size:16px}
.etapas{margin-top:10px;padding:0}

/* cor livre (data-cor="x" + --cor) */
.postit[data-cor="x"],.faixa[data-cor="x"],.forma[data-cor="x"]{background:var(--cor);color:var(--cor-texto)}
.forma[data-cor="x"]{border-color:transparent}
.forma[data-forma="losango"][data-cor="x"],.forma[data-forma="triangulo"][data-cor="x"]{background:transparent}
.forma[data-cor="x"] polygon{fill:var(--cor);stroke:none}
.carta[data-cor="x"]{border-top-color:var(--cor)}
.texto[data-cor="x"]{color:var(--cor)}
.desenho[data-cor="x"] path{stroke:var(--cor)}

/* ligações */
.liga{display:none}
.linhas{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.linhas .traco{stroke:var(--texto-2);stroke-width:3;fill:none}
.linhas .traco.sel{stroke:var(--destaque)}
.linhas .traco.temp{stroke:var(--destaque);stroke-dasharray:8 6}
.linhas .traco.temp.lapis{stroke:var(--texto);stroke-dasharray:none;stroke-width:4;stroke-linecap:round}
.linhas .alvo{stroke:transparent;stroke-width:22;fill:none;pointer-events:stroke;cursor:pointer}
.linhas .ponta{fill:var(--texto-2);stroke:none}
.linhas .ponta.sel{fill:var(--destaque)}

/* áreas de fundo para dinâmicas */
.area{position:relative;flex:1;min-height:0;border:1px dashed var(--borda);border-radius:var(--raio)}
.regua{position:absolute;left:24px;right:24px;bottom:18px;display:flex;justify-content:space-between;font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-3);border-top:1px solid var(--borda);padding-top:12px}
.zonas{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--borda);border-radius:var(--raio);overflow:hidden}
.zona{flex:1;border-bottom:1px dashed var(--borda);padding:16px 24px;font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-3)}
.zona:last-child{border-bottom:0}
.zonas.colunas{flex-direction:row}.zonas.colunas .zona{border-bottom:0;border-right:1px dashed var(--borda)}.zonas.colunas .zona:last-child{border-right:0}
.zona.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 6%,transparent)}.zona.erro{color:var(--erro);background:color-mix(in srgb,var(--erro) 6%,transparent)}

/* ── miniaturas (lateral, mapa, apresentador) ── */
.mini{position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--borda);background:var(--fundo);flex:none}
.mini>.escala{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.mini .slide{opacity:1;visibility:visible;transition:none}
.mini *,.mini .slide{animation:none!important;transition:none!important}
.mini [data-passo]{visibility:visible!important;opacity:1!important;transform:none!important}
.mini *{pointer-events:none!important}
.mini .redim,.mini .chip-destino,.mini aside.notas{display:none!important}
.mini .sel{box-shadow:none!important}

/* ── interface ── */
.ui{font-family:var(--fonte);font-size:14px;color:var(--texto)}
.ui button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:9px;color:var(--texto-2);font-size:13px;white-space:nowrap;line-height:1}
.ui button:hover{background:var(--superficie-2);color:var(--texto)}
.ui button:focus-visible{outline:2px solid var(--destaque)}
.ui button.primario{background:var(--destaque);color:var(--sobre-destaque)}
.ui button.primario:hover{filter:brightness(1.08)}
.ui button.salvar{color:var(--alerta)}
.ui button.salvar::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--alerta)}
.ui svg{flex:none}
#barra{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;align-items:center;gap:2px;padding:6px;background:color-mix(in srgb,var(--superficie) 92%,transparent);backdrop-filter:blur(12px);border:1px solid var(--borda);border-radius:14px;transition:opacity .3s,transform .3s;max-width:calc(100vw - 32px);flex-wrap:wrap}
#barra.oculta{opacity:0;transform:translateY(10px);pointer-events:none}
#contador{color:var(--texto-3);font-variant-numeric:tabular-nums;min-width:58px;text-align:center;font-size:13px}
.sep{width:1px;height:20px;background:var(--borda);margin:0 4px}
@media (max-width:900px){#barra .txt{display:none}}
#trilha{position:fixed;left:16px;top:16px;z-index:40;display:flex;align-items:center;gap:4px;padding:5px 6px;background:color-mix(in srgb,var(--superficie) 92%,transparent);backdrop-filter:blur(12px);border:1px solid var(--borda);border-radius:12px;max-width:calc(100vw - 32px);overflow:hidden}
#trilha .passo-t{color:var(--texto-3);font-size:13px;padding:6px;cursor:pointer;white-space:nowrap;border-radius:7px}
#trilha .passo-t:hover{color:var(--texto);background:var(--superficie-2)}
#trilha .passo-t.agora{color:var(--texto);cursor:default;background:none}
#trilha .seta-t{color:var(--texto-3);font-size:12px}
#lateral{position:fixed;left:0;top:0;bottom:0;width:290px;z-index:60;background:var(--superficie);border-right:1px solid var(--borda);overflow-y:auto;padding:14px;transform:translateX(-100%);transition:transform .3s ease;scrollbar-width:thin;scrollbar-color:var(--borda) transparent}
#lateral.aberto{transform:none}
#lateral.aberto~#trilha{left:306px}
.cab{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:15px;padding:4px 4px 12px}
.cab small{font-weight:400;color:var(--texto-3)}
#lateral .item{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;padding:8px;margin-bottom:4px}
#lateral .item.ramo{padding-left:30px}
#lateral .item.atual{background:var(--superficie-2)}
#lateral .item.atual .mini{border-color:var(--destaque)}
#lateral .leg{font-size:12px;color:var(--texto-2);white-space:normal;line-height:1.3}
#lateral .leg b{color:var(--texto-3);font-weight:600;margin-right:4px}
